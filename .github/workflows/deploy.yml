name: CI/CD with Docker

on:
  push:
    branches:
      - week7

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # GitHub Repository 코드 가져오기
      - name: Checkout source code
        uses: actions/checkout@v4

      # Java 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # GitHub Secrets에 저장한 application.yml 생성
      - name: Make application.yml
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION }}" > src/main/resources/application.yml

      # Gradle 캐시 사용
      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # gradlew 실행 권한 부여
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # Spring Boot 프로젝트 빌드
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # Docker Hub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker Image 빌드 후 Docker Hub에 Push
      - name: Docker build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: kkangchong/efub-seminar:latest

      # EC2 서버에 접속해서 최신 Docker Image 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker pull kkangchong/efub-seminar:latest

            sudo docker stop efub-seminar || true
            sudo docker rm efub-seminar || true

            sudo docker run -d \
              --name efub-seminar \
              -p 8080:8080 \
              -e TZ=Asia/Seoul \
              kkangchong/efub-seminar:latest

            sudo docker image prune -f